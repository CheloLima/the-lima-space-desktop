name: Build The Lima Space Desktop

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build Desktop Installer (.exe)
        run: pnpm make

      - name: Upload Windows Binaries
        uses: actions/upload-artifact@v4
        with:
          name: The-Lima-Space-Windows
          path: |
            out/make/**/*.exe
            out/make/**/*.zip
